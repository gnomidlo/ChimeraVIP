name: ChimeraVIP release check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate release metadata and Lua syntax
        run: lua5.1 tools/release_check.lua
      - name: Test container amounts
        run: lua5.1 tools/containers_test.lua
      - name: Test runtime regressions
        run: lua5.1 tools/runtime_test.lua
      - name: Test updater integrity and rollback
        run: lua5.1 tools/updater_test.lua
